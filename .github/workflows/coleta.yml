name: Coleta Waze Recife
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      verificar:
        description: 'Apenas verificar acesso ao ArcGIS'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: coleta-waze
  cancel-in-progress: false
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: coleta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/collect.mjs
        env:
          PROBE_ONLY: ${{ inputs.verificar }}
          ARCGIS_USERNAME: ${{ secrets.ARCGIS_USERNAME }}
          ARCGIS_PASSWORD: ${{ secrets.ARCGIS_PASSWORD }}
          ARCGIS_TOKEN_URL: ${{ vars.ARCGIS_TOKEN_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
