[build]
publish = "public"
functions = "netlify/functions"
[build.environment]
NODE_VERSION = "22"
[[redirects]]
from = "/api/dashboard"
to = "/.netlify/functions/dashboard"
status = 200
[[headers]]
for = "/*"
[headers.values]
Referrer-Policy = "strict-origin-when-cross-origin"
X-Content-Type-Options = "nosniff"
