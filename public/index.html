<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waze Recife | Monitoramento</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3ynhN2l8FubLG9FvVfJEVPZo0eBRk=" crossorigin="">
<link rel="stylesheet" href="/style.css">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="/app.js"></script>
</head>
<body>
<header><div><p>Mobilidade urbana · Recife</p><h1>Monitoramento Waze</h1></div><span id="last"></span></header>
<main>
<form id="login"><label>Chave de acesso <input id="key" type="password" required></label><button>Acessar painel</button></form>
<p id="status" role="status"></p>
<section id="panel" hidden>
<div class="filters">
<label>Período<select id="days"><option value="1">Últimas 24 horas</option><option value="7" selected>Últimos 7 dias</option><option value="30">Últimos 30 dias</option><option value="90">Últimos 90 dias</option></select></label>
<label>Camada<select id="layer"><option value="">Todas</option><option value="0">Alertas</option><option value="1">Trânsito</option></select></label>
<label>Tipo<select id="type"><option value="">Todos</option></select></label>
<button id="logout">Sair</button>
</div>
<div class="cards">
<article><h2>Alertas</h2><strong id="alerts">—</strong></article>
<article><h2>Registros de trânsito</h2><strong id="traffic">—</strong></article>
</div>
<article><h2>Mapa de ocorrências</h2><p id="map-caption"></p><div id="map" aria-label="Mapa interativo de Recife"></div></article>
<div class="charts"><article><h2>Evolução diária</h2><div id="series"></div></article><article><h2>Ocorrências por tipo</h2><div id="types"></div></article></div>
</section>
</main>
</body></html>
